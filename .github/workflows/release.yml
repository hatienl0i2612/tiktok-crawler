name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            extension: ""
          - name: macOS
            runner: macos-latest
            goos: darwin
            goarch: arm64
            extension: ""
          - name: Windows
            runner: windows-latest
            goos: windows
            goarch: amd64
            extension: .exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build commands
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail

          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/tiktok-${GOOS}-${GOARCH}${EXTENSION}" ./cmd/tiktok
          go build -trimpath -ldflags="-s -w" -o "dist/tiktok_livestream-${GOOS}-${GOARCH}${EXTENSION}" ./cmd/tiktok_livestream

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/tiktok*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
